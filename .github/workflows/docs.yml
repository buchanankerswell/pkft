---
name: Build and Check Docs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    uses: buchanankerswell/actions/.github/workflows/python-docs.yml@v1
